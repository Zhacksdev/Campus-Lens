services:
  career-roadmap-service:
    container_name: career-roadmap-service
    restart: unless-stopped
    build: .
    ports: ["3003:3003"]
    env_file: [.env]
    environment:
      APP_URL: http://localhost:3003
      DB_HOST: mysql-career
      DB_DATABASE: careerdb
      DB_USERNAME: user
      DB_PASSWORD: password
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=3003"
    depends_on:
      mysql-career:
        condition: service_healthy
    networks: [survival-hub-net]

  mysql-career:
    container_name: career-roadmap-db
    restart: unless-stopped
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: careerdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports: ["3307:3306"]
    volumes: [mysql_career_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "user", "-ppassword"]
      start_period: 600s
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [survival-hub-net]

volumes:
  mysql_career_data:

networks:
  survival-hub-net:
    driver: bridge
